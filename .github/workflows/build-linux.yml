# GitHub Actions: Build Linux binary using PyInstaller
# - Builds on ubuntu-22.04 to keep the glibc baseline low (>= 2.35),
#   so the artifact also runs on Debian 12/13 and other older distros
# - Uploads build artifact and creates a GitHub Release when triggered by a tag

name: Build Linux binary (PyInstaller)

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: 'Python version to use (ex: 3.11)'
        required: false
        default: '3.11'
  push:
    branches: [ main ]
    tags: ['v*.*.*']
  pull_request:

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: ISBNQuery
  OUTPUT_DIR: out
  DIST_TAR_NAME: ISBNQuery-linux-x64.tar.gz

jobs:
  build:
    name: Build Linux binary
    runs-on: ubuntu-22.04
    env:
      PYTHON_VERSION: ${{ github.event.inputs.python-version || '3.11' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-linux-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            pip-linux-${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          python -m pip check

      - name: Build with PyInstaller
        run: |
          rm -rf build dist
          python -m PyInstaller --noconfirm --clean isbn_query.spec

      - name: Smoke test
        run: |
          ./dist/ISBNQuery &
          APP_PID=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then ok=1; break; fi
            sleep 1
          done
          kill $APP_PID 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then
            echo "::error::二进制启动后 30 秒内未响应 HTTP 请求"
            exit 1
          fi
          echo "冒烟测试通过：二进制可正常启动并响应 HTTP"

      - name: Package artifact and compute checksum
        run: |
          mkdir -p "$OUTPUT_DIR"
          tar -czf "$OUTPUT_DIR/$DIST_TAR_NAME" -C dist "$APP_NAME"
          sha256sum "$OUTPUT_DIR/$DIST_TAR_NAME" > "$OUTPUT_DIR/$DIST_TAR_NAME.sha256"
          ls -la "$OUTPUT_DIR"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-linux-x64
          path: ${{ env.OUTPUT_DIR }}

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ env.OUTPUT_DIR }}/*
          allowUpdates: true
          replacesArtifacts: true
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Automated build of ${{ env.APP_NAME }}.
            Built with Python ${{ env.PYTHON_VERSION }} on ${{ runner.os }} (glibc baseline: 2.35).
