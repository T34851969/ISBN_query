# GitHub Actions: Build Windows .exe using PyInstaller
# - Builds on windows-latest from isbn_query.spec (onefile, console)
# - Uploads build artifact and creates a GitHub Release when triggered by a tag

name: Build Windows exe (PyInstaller)

on:
  workflow_dispatch:
    inputs:
      python-version:
        description: 'Python version to use (ex: 3.11)'
        required: false
        default: '3.11'
  push:
    branches: [ main ]
    tags: ['v*.*.*']
  pull_request:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: ISBNQuery
  OUTPUT_DIR: out
  DIST_ZIP_NAME: ISBNQuery-windows-x64.zip

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest
    env:
      PYTHON_VERSION: ${{ github.event.inputs.python-version || '3.11' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            pip-${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          python -m pip check

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          # 注意：参数必须逐个传入。PyInstaller 从 spec 构建时，
          # onefile/程序名等已在 spec 内定义，命令行只允许 --noconfirm/--clean。
          python -m PyInstaller --noconfirm --clean isbn_query.spec

      - name: Package artifact and compute checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:OUTPUT_DIR | Out-Null
          $exe = "dist\$env:APP_NAME.exe"
          if (-not (Test-Path $exe)) { throw "构建产物不存在：$exe" }
          Compress-Archive -Path $exe -DestinationPath "$env:OUTPUT_DIR\$env:DIST_ZIP_NAME" -Force
          $hash = (Get-FileHash "$env:OUTPUT_DIR\$env:DIST_ZIP_NAME" -Algorithm SHA256).Hash
          "$hash  $env:DIST_ZIP_NAME" | Out-File "$env:OUTPUT_DIR\$env:DIST_ZIP_NAME.sha256" -Encoding ascii
          Get-ChildItem $env:OUTPUT_DIR

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows-x64
          path: ${{ env.OUTPUT_DIR }}

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ env.OUTPUT_DIR }}/*
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Automated build of ${{ env.APP_NAME }} for Windows.
            Built with Python ${{ env.PYTHON_VERSION }} on ${{ runner.os }}.
